# Local cluster: kind create cluster --config k8s/kind-config.yaml
# One control-plane and one worker, so workloads are scheduled on a node separate from the
# control plane, as in a real cluster.
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: opspilot
nodes:
  - role: control-plane
  - role: worker
