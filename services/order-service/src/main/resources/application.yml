# Every environment-specific value comes from an env var with a local-dev default.
server:
  port: ${PORT:8081}
  shutdown: graceful

spring:
  application:
    name: order-service
  lifecycle:
    timeout-per-shutdown-phase: 20s
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/orders}
    username: ${DB_USER:opspilot}
    password: ${DB_PASSWORD:opspilot}
    hikari:
      connection-timeout: 3000   # fail fast instead of piling up requests when the DB is unreachable
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate          # Flyway owns the schema; Hibernate only checks it matches

opspilot:
  chaos:
    enabled: ${CHAOS_ENABLED:true}
  inventory:
    base-url: ${INVENTORY_URL:http://localhost:8082}
    connect-timeout: 1s
    read-timeout: 2s

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      probes:
        enabled: true
  metrics:
    tags:
      application: ${spring.application.name}
    distribution:
      percentiles-histogram:
        http.server.requests: true
        http.client.requests: true

logging:
  structured:
    format:
      console: ${LOG_FORMAT:ecs}
